[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/AnswerDotAI/nbdev/blob/main/settings.ini for examples.

### Python library ###
repo = zenpy-garden
lib_name = zpgarden 
version = 0.0.2
min_python = 3.9
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = zpgarden
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True
update_pyproject = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Developers
author = Shawn Emhe II 
author_email = shawnemhe@users.noreply.github.com 
copyright = 2025 onwards, %(author)s
description = A FastHTML wrapper for Zendesk Garden CSS
keywords = nbdev jupyter notebook python
language = English
status = 3
user = shawnemhe

### Optional ###
requirements = fastcore python-fasthtml 
